<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141416">
<title>Token check</title>
<link rel="stylesheet" href="styles.css?v=20261115al">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
</head>
<body>
<div id="app"></div>

<div class="dock-wrap" id="dock">
  <nav class="dock">
    <button class="dbtn" data-tab="saved" aria-label="Saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5h12a.5.5 0 0 1 .5.5v15L12 16l-6.5 4V5a.5.5 0 0 1 .5-.5z"/></svg>
      <span data-label="saved">Список</span>
    </button>
    <button class="dscan" data-tab="scan" aria-label="Check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </button>
    <button class="dbtn" data-tab="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>
      <span data-label="profile">Профиль</span>
    </button>
  </nav>
</div>

<script src="app.js?v=20261115al"></script>
</body>
</html>
