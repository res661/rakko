<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1c">
<title>Token check</title>
<link rel="stylesheet" href="styles.css?v=20261118q">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
</head>
<body>
<div id="app"></div>

<div class="dock-wrap" id="dock">
  <nav class="dock">
    <button class="dbtn" data-tab="saved" aria-label="Saved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.6h12a.4.4 0 0 1 .4.4v15L12 16.2 5.6 20V5a.4.4 0 0 1 .4-.4z"/></svg>
    </button>
    <button class="dscan" data-tab="scan" aria-label="Check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.4"/><path d="M15.4 15.4 21 21"/></svg>
    </button>
    <button class="dbtn" data-tab="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.6" r="3.9"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>
    </button>
  </nav>
</div>

<script src="app.js?v=20261118q"></script>
</body>
</html>
